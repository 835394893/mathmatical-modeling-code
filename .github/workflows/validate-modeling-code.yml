name: Validate modeling code

on:
  push:
    branches:
      - refactor/project-layout
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib seaborn scipy scikit-learn

      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('源程序代码/问题一/notebooks/problem1.ipynb'),
              Path('源程序代码/问题二/notebooks/problem2.ipynb'),
          ]:
              with path.open(encoding='utf-8') as f:
                  notebook = json.load(f)
              assert notebook['nbformat'] == 4
              assert notebook['cells'], f'{path} has no cells'
              print(f'OK: {path}')
          PY

      - name: Run problem 1
        run: python "源程序代码/问题一/src/problem1.py"

      - name: Check problem 1 outputs
        run: |
          test -f "源程序代码/问题一/outputs/山西高考物理组成绩概率分布.png"
          test -f "源程序代码/问题一/outputs/山西高考历史组成绩概率分布.png"

      - name: Run problem 2
        run: python "源程序代码/问题二/src/problem2.py"

      - name: Check problem 2 outputs
        run: |
          test -f "源程序代码/问题二/outputs/TOPSIS_input_matrix.csv"
          test -f "源程序代码/问题二/outputs/TOPSIS_result.csv"
          test -f "源程序代码/问题二/outputs/六对象典型分数转换表.csv"
          test -f "源程序代码/问题二/outputs/山西基准跨省换分表.csv"
